services:
  aurral:
    image: ghcr.io/lklynet/aurral:latest
    container_name: aurral-pocket-test-aurral
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TRUST_PROXY=${TRUST_PROXY:-false}
    volumes:
      - ./data/config:/config
      - ./data/music:/data
    ports:
      - "${AURRAL_PORT:-3001}:3001"
    restart: unless-stopped
