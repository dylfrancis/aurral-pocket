apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.audiooutput'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()
useExpoPublishing()

android {
  namespace "expo.modules.audiooutput"
  defaultConfig {
    minSdkVersion 24
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // The version the audio engine's Cast dependencies already resolve to, so
  // this adds no new copy to the app.
  implementation "androidx.mediarouter:mediarouter:1.8.1"
}
