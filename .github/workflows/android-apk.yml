name: Android APK

# Attaches an installable APK to each stable release, for people who install
# from GitHub or Obtainium rather than Google Play. The release build in
# .eas/workflows/release.yml makes an .aab, which only Play can install.
#
# Prereleases are skipped: their tags (v1.3.0-test.1) don't match the version
# the app reports (1.3.0), which confuses Obtainium's update check.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the APK to, such as v0.15.0"
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: Build and attach APK
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build the APK on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile github-apk \
            --non-interactive --wait --json --message "$TAG (GitHub APK)" \
            > "$RUNNER_TEMP/build.json"

      - name: Download the APK
        run: |
          url="$(jq -r '.[0].artifacts.applicationArchiveUrl // .[0].artifacts.buildUrl' "$RUNNER_TEMP/build.json")"
          curl -fsSL "$url" -o "aurral-pocket-${TAG#v}.apk"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "aurral-pocket-${TAG#v}.apk" --clobber
